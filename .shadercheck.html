<!doctype html><html><head><meta charset="utf-8"><title>shadercheck</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script></head>
<body><canvas id="c" width="800" height="450"></canvas><pre id="out"></pre>
<script type="module">
import * as THREE from 'three';
import { createEffects } from './src/render/effects.js';

const log = [];
const say = (s) => { log.push(s); document.getElementById('out').textContent = log.join('\n'); };
const shaderErrors = [];
window.__done = false;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.debug.onShaderError = (gl, prog, vs, fs) => {
  shaderErrors.push('VS log: ' + gl.getShaderInfoLog(vs) + '\nFS log: ' + gl.getShaderInfoLog(fs));
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101820);
const camera = new THREE.PerspectiveCamera(60, 800 / 450, 0.1, 2000);
camera.position.set(0, 2, 5);
camera.lookAt(0, 1, -10);

// Something bright enough to bloom (linear > 1) plus something dull.
const bright = new THREE.Mesh(
  new THREE.SphereGeometry(0.6, 16, 12),
  new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0xffeecc, emissiveIntensity: 4 }));
bright.position.set(1.2, 1.4, -6);
scene.add(bright);
const dull = new THREE.Mesh(new THREE.BoxGeometry(20, 0.2, 200),
  new THREE.MeshStandardMaterial({ color: 0x333a40 }));
dull.position.set(0, 0, -80);
scene.add(dull);
scene.add(new THREE.HemisphereLight(0x8899bb, 0x223022, 1.2));

try {
  const fx = createEffects(renderer, scene, camera, { width: 800, height: 450 });
  say('created, quality=' + fx.quality);
  say('gl version: ' + renderer.getContext().getParameter(renderer.getContext().VERSION));

  for (const q of ['high', 'medium', 'low', 'off', 'high', 'low', 'medium', 'off', 'high']) {
    fx.setQuality(q);
    for (const v of [0, 0.2, 0.5, 0.9, 1]) {
      fx.setSpeedBlur(v);
      for (let i = 0; i < 40; i++) fx.render(1 / 60);
    }
    fx.setSize(1024, 576);
    fx.render(1 / 60);
    fx.setSize(800, 450);
    fx.render(1 / 60);
    const gl = renderer.getContext();
    const err = gl.getError();
    say('  tier ' + q + ' rendered, glError=' + err + ' progs=' + renderer.info.programs.length);
  }
  fx.dispose(); fx.dispose(); fx.render(1 / 60);
  say('disposed ok');
  say(shaderErrors.length ? 'SHADER ERRORS:\n' + shaderErrors.join('\n---\n') : 'NO SHADER ERRORS');
} catch (e) {
  say('EXCEPTION: ' + (e && e.stack || e));
}
window.__done = true;
window.__log = log.join('\n');
</script></body></html>
