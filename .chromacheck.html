<!doctype html><html><head><meta charset="utf-8"><title>chromacheck</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script></head>
<body><canvas id="c" width="640" height="360"></canvas><pre id="out"></pre>
<script type="module">
import * as THREE from 'three';
import { createEffects } from './src/render/effects.js';
const out = [];
const say = s => { out.push(s); document.getElementById('out').textContent = out.join('\n'); };

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(60, 640/360, 0.1, 2000);
camera.position.set(0,0,5); camera.lookAt(0,0,0);

// A high-contrast vertical bar grid near the left edge: maximal horizontal detail
// exactly where the radial blur is strongest.
const g = new THREE.PlaneGeometry(0.06, 6);
const m = new THREE.MeshBasicMaterial({ color: 0xffffff });
for (let i = 0; i < 40; i++) {
  const bar = new THREE.Mesh(g, m);
  bar.position.set(-5.2 + i * 0.16, 0, 0);
  scene.add(bar);
}

const fx = createEffects(renderer, scene, camera, { width: 640, height: 360, maxPixelRatio: 1 });
fx.setQuality('high');

function sharpnessPerChannel() {
  const gl = renderer.getContext();
  const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
  const px = new Uint8Array(w * h * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  // Sample a horizontal strip in the left third (strong radial blur region).
  const y0 = Math.floor(h * 0.45), y1 = Math.floor(h * 0.55);
  const x0 = Math.floor(w * 0.04), x1 = Math.floor(w * 0.30);
  const acc = [0, 0, 0];
  let n = 0;
  for (let y = y0; y < y1; y++) {
    for (let x = x0; x < x1 - 1; x++) {
      const a = (y * w + x) * 4, b = (y * w + x + 1) * 4;
      acc[0] += Math.abs(px[a] - px[b]);
      acc[1] += Math.abs(px[a+1] - px[b+1]);
      acc[2] += Math.abs(px[a+2] - px[b+2]);
      n++;
    }
  }
  return acc.map(v => v / n);
}

function settleAndMeasure(v) {
  fx.setSpeedBlur(v);
  for (let i = 0; i < 400; i++) fx.render(1/60);
  return sharpnessPerChannel();
}

for (const v of [0, 0.36, 0.6, 0.8, 1.0]) {
  const s = settleAndMeasure(v);
  say(`v=${v.toFixed(2)}  edge-energy  R=${s[0].toFixed(2)}  G=${s[1].toFixed(2)}  B=${s[2].toFixed(2)}   R/G=${(s[0]/(s[1]||1)).toFixed(2)}  B/G=${(s[2]/(s[1]||1)).toFixed(2)}`);
}
window.__done = true;
</script></body></html>
