<!doctype html><html><head><meta charset="utf-8"><title>visualcheck</title>
<style>body{margin:0;background:#111;font:12px monospace;color:#ccc}figure{margin:0;display:inline-block}figcaption{padding:2px 4px}</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script></head><body>
<div id="grid"></div>
<script type="module">
import * as THREE from 'three';
import { createEffects } from './src/render/effects.js';
const canvas = document.createElement('canvas'); canvas.width=560; canvas.height=315;
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, preserveDrawingBuffer:true });
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a0e14);
const camera = new THREE.PerspectiveCamera(65, 560/315, 0.1, 3000);
camera.position.set(0,1.6,0); camera.lookAt(0,1.4,-30);
scene.add(new THREE.HemisphereLight(0x6688cc, 0x111511, 0.9));
// road
const road = new THREE.Mesh(new THREE.PlaneGeometry(12, 600), new THREE.MeshStandardMaterial({color:0x23262b, roughness:1}));
road.rotation.x = -Math.PI/2; road.position.set(0,0,-300); scene.add(road);
// dashed centre line + lamp posts with bright emissive heads (should bloom)
const lineG = new THREE.PlaneGeometry(0.22, 3);
const lineM = new THREE.MeshBasicMaterial({color:0xdddddd});
for (let i=0;i<80;i++){ const l=new THREE.Mesh(lineG,lineM); l.rotation.x=-Math.PI/2; l.position.set(0,0.01,-i*7-4); scene.add(l); }
const headG = new THREE.SphereGeometry(0.35,12,10);
const headM = new THREE.MeshStandardMaterial({color:0x111111, emissive:0xffdca8, emissiveIntensity:6});
const poleG = new THREE.CylinderGeometry(0.08,0.08,6,6);
const poleM = new THREE.MeshStandardMaterial({color:0x2a2e33});
for (let i=0;i<26;i++){ for (const sx of [-6.5,6.5]) {
  const h=new THREE.Mesh(headG,headM); h.position.set(sx,6,-i*16-8); scene.add(h);
  const p=new THREE.Mesh(poleG,poleM); p.position.set(sx,3,-i*16-8); scene.add(p);
}}
const fx = createEffects(renderer, scene, camera, { width:560, height:315, maxPixelRatio:1 });
const grid = document.getElementById('grid');
function shot(label){
  for(let i=0;i<400;i++) fx.render(1/60);
  const fig=document.createElement('figure'); const img=new Image(); img.src=canvas.toDataURL();
  const cap=document.createElement('figcaption'); cap.textContent=label;
  fig.appendChild(img); fig.appendChild(cap); grid.appendChild(fig);
}
for (const q of ['off','low','medium','high']) { fx.setQuality(q); fx.setSpeedBlur(0); shot(q+' @ 0 km/h'); }
for (const q of ['low','medium','high']) { fx.setQuality(q); fx.setSpeedBlur(1); shot(q+' @ top speed'); }
window.__done = true;
</script></body></html>
